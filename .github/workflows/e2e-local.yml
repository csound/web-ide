name: E2E — Local

on:
    pull_request:
        types: [opened, synchronize, reopened]
    workflow_dispatch:

concurrency:
    group: e2e-local-${{ github.ref }}
    cancel-in-progress: true

jobs:
    install:
        name: Install dependencies
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: "npm"

            - name: Install project dependencies
              run: npm ci

            - name: Install test dependencies
              working-directory: puppeteer-tests
              run: npm ci

            - name: Resolve Chrome executable
              working-directory: puppeteer-tests
              run: npm run install:chrome

            - name: Cache node_modules
              uses: actions/cache/save@v6
              with:
                  path: |
                      node_modules
                      puppeteer-tests/node_modules
                  key: nm-v3-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json', 'puppeteer-tests/package-lock.json') }}

    e2e:
        name: E2E local — ${{ matrix.suite }}
        needs: install
        runs-on: ubuntu-latest
        timeout-minutes: 15

        strategy:
            fail-fast: false
            matrix:
                suite:
                    [
                        home,
                        editor,
                        manual,
                        manual-examples,
                        manual-code,
                        audio-tools,
                        mixer,
                        project-playback,
                        csd-diagnostics,
                        score-preprocessors,
                        pvx-tools,
                        worker-hosting
                    ]

        steps:
            - uses: actions/checkout@v7
              with:
                  submodules: recursive

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.12"
                  cache: pip
                  cache-dependency-path: manual/requirements.txt

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc

            - name: Restore node_modules
              uses: actions/cache/restore@v6
              with:
                  path: |
                      node_modules
                      puppeteer-tests/node_modules
                  key: nm-v3-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json', 'puppeteer-tests/package-lock.json') }}

            - name: Resolve Chrome executable
              working-directory: puppeteer-tests
              run: npm run install:chrome

            - name: Build manual
              run: npm run manual:prepare

            - name: Start dev server
              run: npm run start -- --open false &
              env:
                  BROWSER: none

            - name: Wait for dev server
              run: npx wait-on http://localhost:3000 --timeout 120000

            - name: Run ${{ matrix.suite }} tests
              working-directory: puppeteer-tests
              run: node --test tests/${{ matrix.suite }}.js
              env:
                  TARGET: local

            - name: Upload debug artifacts
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: e2e-debug-${{ matrix.suite }}
                  path: puppeteer-tests/screenshots/
                  retention-days: 7
                  if-no-files-found: ignore
