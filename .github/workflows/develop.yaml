name: "Deploy Develop"
on:
    push:
        branches:
            - develop
    workflow_dispatch:
permissions:
    contents: read
    actions: read
concurrency:
    group: deploy-csound-ide-dev
    cancel-in-progress: false
jobs:
    deploy-dev:
        name: deploy-develop
        runs-on: ubuntu-latest
        if: github.ref == 'refs/heads/develop'
        # Allow recovery backoffs plus builds, API calls, and Hosting publication.
        timeout-minutes: 240
        env:
            REACT_APP_DATABASE: DEV
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v7
              with:
                  submodules: recursive
                  fetch-depth: 0
            - uses: actions/setup-python@v7
              with:
                  python-version: "3.12"
                  cache: pip
                  cache-dependency-path: manual/requirements.txt
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - name: Install Dependencies
              run: |
                  npm ci
                  npm ci --prefix functions
            - name: Install Rollup Linux Native Binary
              if: runner.os == 'Linux'
              run: |
                  ROLLUP_VERSION=$(node -e "const fs=require('fs'); const path=require('path'); const main=require.resolve('rollup'); const pkg=JSON.parse(fs.readFileSync(path.join(path.dirname(main), '..', 'package.json'),'utf8')); process.stdout.write(pkg.version)")
                  npm install --no-save @rollup/rollup-linux-x64-gnu@$ROLLUP_VERSION
            - name: Lint And Format Check
              run: |
                  npm run lint
                  npm run typecheck
                  npm run format:check
            - name: Authenticate dev deployment
              uses: google-github-actions/auth@v3
              with:
                  credentials_json: ${{ secrets.GCP_SA_KEY_DEV }}
            - name: Check dev deployment permissions
              run: node scripts/deploy-dev.mjs --preflight
            - name: Build Csound checker
              uses: ./.github/actions/csound-check
              with:
                  cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
            - name: Build
              run: |
                  echo "STORAGE_BUCKET_URL=gs://csound-ide-dev.appspot.com" >> functions/.env.dev
                  PUBLIC_URL="https://csound-ide-dev.web.app" npm run build:dev
                  cp dist/index.html functions
                  cd functions
                  npm run build
            - name: Prepare dev deploy without Extensions
              run: |
                  npm run test:deploy:dev
                  npm run test:access
                  npm run test:indexes
                  npm run prepare:deploy:dev
            - name: Deploy Firestore indexes
              # Preserve unrelated indexes and field settings; do not use --force.
              run: ./functions/node_modules/.bin/firebase deploy -P develop --config firebase.json --only firestore:indexes --non-interactive
            - name: Deploy to Firebase
              run: node scripts/deploy-dev.mjs --functions
              env:
                  GH_TOKEN: ${{ github.token }}
            - name: Apply dev browser access and check page loads
              run: npm run access -- --env dev --apply
            - name: Publish Hosting after functions are ready
              run: ./functions/node_modules/.bin/firebase deploy -P develop --config firebase.dev.generated.json --only hosting --non-interactive
            - name: Check published dev browser access
              run: npm run access -- --env dev --check
