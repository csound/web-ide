name: "CI Test"
on:
    pull_request:
        branches:
            - develop
            - master
    push:
        branches:
            - develop
            - master
jobs:
    test:
        name: test
        runs-on: ubuntu-latest
        env:
            REACT_APP_DATABASE: DEV
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v7
              with:
                  submodules: recursive
            - uses: actions/setup-python@v7
              with:
                  python-version: "3.12"
                  cache: pip
                  cache-dependency-path: manual/requirements.txt
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - name: Install Dependencies
              run: npm install
            - name: Install Functions Dependencies
              run: npm ci --prefix functions
            - name: Install Rollup Linux Native Binary
              if: runner.os == 'Linux'
              run: |
                  ROLLUP_VERSION=$(node -e "const fs=require('fs'); const path=require('path'); const main=require.resolve('rollup'); const pkg=JSON.parse(fs.readFileSync(path.join(path.dirname(main), '..', 'package.json'),'utf8')); process.stdout.write(pkg.version)")
                  npm install --no-save @rollup/rollup-linux-x64-gnu@$ROLLUP_VERSION
            - name: Run Tests
              run: npm run test:ci
            - name: Check manual
              run: npm run test:manual && npm run manual:check
            - name: Test callable access
              run: npm run test:access
            - name: Test Firestore indexes
              run: npm run test:indexes
            - name: Check Functions Types
              working-directory: functions
              run: npx tsc --noEmit -p tsconfig.json
