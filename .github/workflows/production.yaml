name: "Deploy Production"
on:
    push:
        branches:
            - master
jobs:
    deploy-prod:
        name: deploy-production
        runs-on: ubuntu-latest
        env:
            REACT_APP_DATABASE: PROD
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v7
              with:
                  submodules: recursive
            - uses: actions/setup-python@v7
              with:
                  python-version: "3.12"
                  cache: pip
                  cache-dependency-path: manual/requirements.txt
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - name: Install Dependencies
              run: npm install
            - name: Install Rollup Linux Native Binary
              if: runner.os == 'Linux'
              run: |
                  ROLLUP_VERSION=$(node -e "const fs=require('fs'); const path=require('path'); const main=require.resolve('rollup'); const pkg=JSON.parse(fs.readFileSync(path.join(path.dirname(main), '..', 'package.json'),'utf8')); process.stdout.write(pkg.version)")
                  npm install --no-save @rollup/rollup-linux-x64-gnu@$ROLLUP_VERSION
            - name: Lint And Format Check
              run: |
                  npm run lint
                  npm run typecheck
                  npm run format:check
            - name: Build
              run: |
                  echo "STORAGE_BUCKET_URL=gs://csound-ide.appspot.com" >> functions/.env
                  PUBLIC_URL="https://ide.csound.com" PRODUCTION=1 npm run build
                  cp dist/index.html functions
                  cd functions
                  npm ci
                  npm run build
            - name: Test deployment configuration
              run: |
                  npm run test:access
                  npm run test:indexes
            - name: Deploy Firestore indexes
              uses: docker://w9jds/firebase-action:v15.19.1
              with:
                  # Keep unrelated indexes and field settings during deployment.
                  args: deploy -P default --config firebase.json --only firestore:indexes --non-interactive
              env:
                  GCP_SA_KEY: ${{ secrets.GCP_SA_KEY_PROD }}
            - name: Deploy to Firebase
              uses: docker://w9jds/firebase-action:v15.19.1
              with:
                  args: deploy -P default --only functions,hosting
              env:
                  GCP_SA_KEY: ${{ secrets.GCP_SA_KEY_PROD }}
                  REACT_APP_DATABASE: PROD
            - name: Authenticate for production browser access
              uses: google-github-actions/auth@v3
              with:
                  credentials_json: ${{ secrets.GCP_SA_KEY_PROD }}
            - name: Apply production browser access and check page loads
              run: npm run access -- --env prod --apply
