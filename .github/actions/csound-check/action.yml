name: Build Csound editor tools
description: Build the pinned parser and GEN WASM required in CI and deployments.
inputs:
    cachix-auth-token:
        description: Optional Cachix write token supplied by deployment workflows.
        required: false
        default: ""
runs:
    using: composite
    steps:
        - shell: bash
          run: node --test scripts/build-csound-check.test.mjs
        - uses: cachix/install-nix-action@v31.11.1
        - uses: cachix/cachix-action@v17
          with:
              name: csound-web-ide
              extraPullNames: csound
              authToken: ${{ inputs.cachix-auth-token }}
              skipPush: ${{ inputs.cachix-auth-token == '' }}
        - shell: bash
          run: npm run checker:build -- --required
        - shell: bash
          run: npm run test:ci -- src/components/editor/validation/run.test.ts src/components/editor/ftgen/run.test.ts
