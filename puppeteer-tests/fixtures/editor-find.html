<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Editor Find check</title>
        <style>
            body {
                margin: 0;
                font-family: system-ui, sans-serif;
            }
            main {
                padding: 16px;
                display: grid;
                gap: 16px;
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
            header {
                grid-column: 1 / -1;
            }
            section {
                min-width: 0;
            }
            h2 {
                font-size: 14px;
                margin: 0 0 8px;
            }
            .editor-host {
                height: 300px;
            }
            @media (max-width: 600px) {
                main {
                    grid-template-columns: minmax(0, 1fr);
                }
            }
        </style>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="./editor-find.tsx"></script>
    </body>
</html>
